<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#333"/>
    </marker>
    <marker id="arrd" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Вне AWS -->
  <rect x="20" y="15" width="200" height="70" rx="8" fill="#eef3f8" stroke="#5b7c99"/>
  <text x="120" y="42" text-anchor="middle" font-size="13" font-weight="bold">Пользователи</text>
  <text x="120" y="60" text-anchor="middle" font-size="11" fill="#555">браузер → http://EIP app</text>

  <rect x="250" y="15" width="170" height="70" rx="8" fill="#eef3f8" stroke="#5b7c99"/>
  <text x="335" y="42" text-anchor="middle" font-size="13" font-weight="bold">Ваш компьютер</text>
  <text x="335" y="60" text-anchor="middle" font-size="11" fill="#555">ssh bastion / deploy.sh</text>

  <rect x="450" y="15" width="150" height="70" rx="8" fill="#eef3f8" stroke="#5b7c99"/>
  <text x="525" y="42" text-anchor="middle" font-size="13" font-weight="bold">GitHub</text>
  <text x="525" y="60" text-anchor="middle" font-size="11" fill="#555">репозиторий app</text>

  <!-- AWS Cloud -->
  <rect x="20" y="100" width="920" height="500" rx="10" fill="#fafbfc" stroke="#e8930c" stroke-width="2"/>
  <text x="40" y="125" font-size="14" font-weight="bold" fill="#e8930c">AWS Cloud · eu-central-1 (Frankfurt)</text>

  <!-- VPC -->
  <rect x="40" y="140" width="880" height="440" rx="8" fill="#fff" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="60" y="163" font-size="13" font-weight="bold">VPC timecapsule-dev-vpc · 10.3.0.0/16 · DNS hostnames + resolution</text>

  <!-- IGW -->
  <rect x="380" y="172" width="200" height="34" rx="6" fill="#d5e8d4" stroke="#43853d"/>
  <text x="480" y="193" text-anchor="middle" font-size="12" font-weight="bold">timecapsule-dev-igw</text>

  <!-- AZ A -->
  <rect x="60" y="220" width="400" height="340" rx="6" fill="#f4f8fb" stroke="#7f9bb3" stroke-dasharray="4 3"/>
  <text x="260" y="242" text-anchor="middle" font-size="12" fill="#33608c">Зона доступности eu-central-1a</text>

  <!-- AZ B -->
  <rect x="500" y="220" width="400" height="340" rx="6" fill="#f4f8fb" stroke="#7f9bb3" stroke-dasharray="4 3"/>
  <text x="700" y="242" text-anchor="middle" font-size="12" fill="#33608c">Зона доступности eu-central-1b</text>

  <!-- public-a -->
  <rect x="80" y="255" width="360" height="105" rx="6" fill="#e1f5fe" stroke="#0288d1"/>
  <text x="260" y="275" text-anchor="middle" font-size="12" font-weight="bold">public-a · 10.3.0.0/24 · public-rt → igw</text>
  <rect x="95" y="288" width="200" height="58" rx="6" fill="#fff" stroke="#0288d1"/>
  <text x="195" y="308" text-anchor="middle" font-size="11" font-weight="bold">timecapsule-dev-app</text>
  <text x="195" y="323" text-anchor="middle" font-size="10">NixOS · nginx+php-fpm</text>
  <text x="195" y="338" text-anchor="middle" font-size="10">Elastic IP: timecapsule-dev-app-eip</text>
  <rect x="310" y="288" width="120" height="58" rx="6" fill="#fff" stroke="#0288d1" stroke-dasharray="5 3"/>
  <text x="370" y="312" text-anchor="middle" font-size="10" fill="#c0392b">NAT Gateway</text>
  <text x="370" y="326" text-anchor="middle" font-size="9" fill="#c0392b">(временный)</text>
  <text x="370" y="338" text-anchor="middle" font-size="9" fill="#c0392b">timecapsule-dev-nat-a</text>

  <!-- private-a -->
  <rect x="80" y="380" width="360" height="105" rx="6" fill="#f3e5f5" stroke="#7b1fa2"/>
  <text x="260" y="400" text-anchor="middle" font-size="12" font-weight="bold">private-a · 10.3.10.0/24 · private-rt (нет igw)</text>
  <rect x="130" y="413" width="260" height="58" rx="6" fill="#fff" stroke="#7b1fa2"/>
  <text x="260" y="433" text-anchor="middle" font-size="11" font-weight="bold">timecapsule-dev-db · PostgreSQL 16</text>
  <text x="260" y="448" text-anchor="middle" font-size="10">без публичного IP · db-sg: 5432 от web-sg</text>
  <text x="260" y="462" text-anchor="middle" font-size="10" fill="#7b1fa2">db.timecapsule.internal (приватная Route 53)</text>

  <!-- public-b -->
  <rect x="520" y="255" width="360" height="105" rx="6" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="700" y="275" text-anchor="middle" font-size="12" font-weight="bold">public-b · 10.3.1.0/24 · public-rt → igw</text>
  <rect x="600" y="288" width="200" height="58" rx="6" fill="#fff" stroke="#2e7d32"/>
  <text x="700" y="310" text-anchor="middle" font-size="11" font-weight="bold">timecapsule-dev-bastion</text>
  <text x="700" y="326" text-anchor="middle" font-size="10">jump host · SSH только с вашего IP</text>
  <text x="700" y="340" text-anchor="middle" font-size="10">bastion-sg: 22 ← My IP</text>

  <!-- private-b -->
  <rect x="520" y="380" width="360" height="105" rx="6" fill="#f5f5f5" stroke="#9e9e9e" stroke-dasharray="4 3"/>
  <text x="700" y="435" text-anchor="middle" font-size="11" fill="#777">private-b · 10.3.11.0/24 · резерв</text>

  <!-- Route tables note -->
  <rect x="80" y="500" width="360" height="40" rx="6" fill="#fff8e1" stroke="#f9a825"/>
  <text x="260" y="524" text-anchor="middle" font-size="10">public-rt: 0.0.0.0/0 → igw · private-rt: только local</text>
  <rect x="520" y="500" width="360" height="40" rx="6" fill="#fff8e1" stroke="#f9a825"/>
  <text x="700" y="524" text-anchor="middle" font-size="10">web-sg: 80 ← 0.0.0.0/0, 22 ← bastion-sg · db-sg: 5432 ← web-sg, 22 ← bastion-sg</text>

  <!-- Стрелки -->
  <line x1="120" y1="85" x2="400" y2="172" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="200" y="130" font-size="10" fill="#333">HTTP :80</text>

  <line x1="335" y1="85" x2="680" y2="288" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="520" y="160" font-size="10" fill="#333">SSH :22 (только с вашего IP)</text>

  <line x1="525" y1="85" x2="300" y2="288" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="380" y="210" font-size="10" fill="#666">git pull (deploy.sh)</text>

  <line x1="295" y1="346" x2="260" y2="413" stroke="#333" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="310" y="385" font-size="10" fill="#333">psql :5432 через db.timecapsule.internal</text>

  <line x1="800" y1="317" x2="300" y2="430" stroke="#333" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arr)"/>
  <text x="580" y="400" font-size="10">SSH через ProxyJump</text>

  <line x1="370" y1="288" x2="480" y2="206" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrd)"/>
  <text x="430" y="250" font-size="9" fill="#c0392b">временный выход</text>

  <!-- legend -->
  <text x="60" y="575" font-size="10" fill="#555">Пунктир — временные/служебные связи · Реальные имена по соглашению &lt;project&gt;-&lt;env&gt;-&lt;role&gt; · NixOS AMI: owner 427812963091 (EC2 AMI registry)</text>
</svg>
